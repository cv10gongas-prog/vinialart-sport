<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Sombra suave no estúdio -->
    <radialGradient id="armDropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Tecido elástico desportivo branco para mistura (multiply) perfeita -->
    <linearGradient id="bandShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Volume curvo e iluminação cilíndrica do braço -->
    <linearGradient id="armLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Textura canelada do elastano técnico -->
    <pattern id="elasticTexture" width="4" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#cbd5e1" stroke-width="0.8" opacity="0.35"/>
    </pattern>

    <filter id="studioFilter" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sombra no solo -->
  <ellipse cx="400" cy="535" rx="310" ry="24" fill="url(#armDropGlow)"/>

  <g filter="url(#studioFilter)">
    <!-- Corpo Principal Elástico -->
    <rect x="80" y="300" width="640" height="200" rx="10" fill="url(#bandShade)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="80" y="300" width="640" height="200" rx="10" fill="url(#elasticTexture)"/>
    <rect x="80" y="300" width="640" height="200" rx="10" fill="url(#armLight)"/>

    <!-- Debruado / Bainha Elástica Superior com Pesponto -->
    <rect x="80" y="300" width="640" height="20" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="84" y1="310" x2="716" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>

    <!-- Debruado / Bainha Elástica Inferior com Pesponto -->
    <rect x="80" y="480" width="640" height="20" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="84" y1="490" x2="716" y2="490" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>

    <!-- Presilha Elástica de Retenção do Braço (Esquerda) -->
    <rect x="80" y="304" width="56" height="192" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <line x1="108" y1="310" x2="108" y2="490" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="108" y="406" fill="#94a3b8" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="2">ARM</text>

    <!-- Aba de Velcro com Costura em Cruz (Direita) -->
    <rect x="660" y="304" width="60" height="192" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <rect x="664" y="308" width="52" height="184" fill="#e2e8f0" opacity="0.65"/>
    <line x1="668" y1="316" x2="712" y2="484" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="712" y1="316" x2="668" y2="484" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="668" y="314" width="44" height="172" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
</svg>
