<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <defs>
    <!-- Background studio glow -->
    <radialGradient id="mochilaBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#090c10"/>
    </radialGradient>

    <!-- Sombra de solo / mesa -->
    <radialGradient id="mochilaFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente do corpo da mochila -->
    <linearGradient id="mochilaBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Gradiente do bolso frontal (área principal) -->
    <linearGradient id="mochilaPocketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="20%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d5dde8"/>
    </linearGradient>

    <!-- Volume vertical do bolso frontal -->
    <linearGradient id="mochilaPocketVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="15%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Fundo estúdio escuro padrão -->
  <rect width="480" height="480" fill="url(#mochilaBgGlow)"/>

  <!-- Sombra no chão -->
  <ellipse cx="240" cy="445" rx="160" ry="24" fill="url(#mochilaFloorShadow)"/>

  <!-- Alça de mão superior -->
  <path d="M195 90 C195 50, 285 50, 285 90" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
  <path d="M195 90 C195 50, 285 50, 285 90" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

  <!-- Alças de ombro visíveis atrás do corpo -->
  <path d="M150 140 C110 200, 100 320, 115 400" fill="none" stroke="#1e293b" stroke-width="22" stroke-linecap="round"/>
  <path d="M330 140 C370 200, 380 320, 365 400" fill="none" stroke="#1e293b" stroke-width="22" stroke-linecap="round"/>

  <!-- Corpo Principal da Mochila -->
  <path d="M150 140 C170 85, 310 85, 330 140 L345 380 C345 425, 135 425, 135 380 Z"
        fill="url(#mochilaBodyGrad)"
        stroke="#94a3b8"
        stroke-width="2"/>

  <!-- Costuras e detalhes do topo -->
  <path d="M165 145 C185 105, 295 105, 315 145" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Linha do fecho principal superior -->
  <path d="M150 155 C175 110, 305 110, 330 155 L340 230 C270 238, 210 238, 140 230 Z"
        fill="none"
        stroke="#475569"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Puxadores do fecho principal -->
  <circle cx="232" cy="118" r="4" fill="#334155"/>
  <circle cx="248" cy="118" r="4" fill="#334155"/>

  <!-- Bolso Frontal Principal (Área de Personalização) -->
  <g id="front-pocket">
    <!-- Base e forma do bolso com cantos arredondados -->
    <path d="M145 240 C145 225, 335 225, 335 240 L340 395 C340 422, 140 422, 140 395 Z"
          fill="url(#mochilaPocketGrad)"
          stroke="#94a3b8"
          stroke-width="2"/>

    <!-- Sombreamento de curvatura do bolso -->
    <path d="M145 240 C145 225, 335 225, 335 240 L340 395 C340 422, 140 422, 140 395 Z"
          fill="url(#mochilaPocketVert)"
          style="mix-blend-mode: multiply;"/>

    <!-- Aba / Fecho do Bolso Frontal -->
    <path d="M148 238 C175 232, 305 232, 332 238" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M148 238 C175 232, 305 232, 332 238" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cursor do fecho do bolso -->
    <rect x="234" y="233" width="12" height="6" rx="2" fill="#1e293b"/>
    <path d="M240 239 L240 248" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Costura de reforço na orla do bolso -->
    <path d="M152 250 L148 392 C148 412, 332 412, 332 392 L328 250"
          fill="none"
          stroke="#94a3b8"
          stroke-width="1.5"
          stroke-dasharray="5 3"/>
  </g>

  <!-- Pormenores inferiores e presilha -->
  <rect x="228" y="415" width="24" height="6" rx="2" fill="#475569"/>
</svg>
