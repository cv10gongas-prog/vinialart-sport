<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <!-- Sombra suave no chão do estúdio -->
    <radialGradient id="armDrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Tecido elástico branco premium com reflexos desportivos -->
    <linearGradient id="bandFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="12%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#dbe1ea"/>
    </linearGradient>

    <!-- Volume curvo do braço (luz central e sombras suaves nas extremidades) -->
    <linearGradient id="armHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Textura canelada do elastano desportivo -->
    <pattern id="elasticRib" width="3" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="3" y2="0" stroke="#cbd5e1" stroke-width="0.6" opacity="0.3"/>
    </pattern>

    <!-- Gradiente do debruado elástico (bainhas) -->
    <linearGradient id="pipingShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e9eef5"/>
      <stop offset="100%" stop-color="#cfd8e3"/>
    </linearGradient>

    <filter id="studioShadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sombra no solo -->
  <ellipse cx="240" cy="330" rx="190" ry="14" fill="url(#armDrop)"/>

  <g filter="url(#studioShadow)">
    <!-- Fita Elástica Principal -->
    <rect x="48" y="182" width="384" height="116" rx="6" fill="url(#bandFabric)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="48" y="182" width="384" height="116" rx="6" fill="url(#elasticRib)"/>
    <rect x="48" y="182" width="384" height="116" rx="6" fill="url(#armHighlight)"/>

    <!-- Debruado / Bainha Elástica Superior com Pesponto Duplo -->
    <rect x="48" y="182" width="384" height="12" rx="3" fill="url(#pipingShade)" stroke="#b8c5d3" stroke-width="1"/>
    <line x1="50" y1="187" x2="430" y2="187" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 1.5"/>
    <line x1="50" y1="191" x2="430" y2="191" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3 1.5"/>

    <!-- Debruado / Bainha Elástica Inferior com Pesponto Duplo -->
    <rect x="48" y="286" width="384" height="12" rx="3" fill="url(#pipingShade)" stroke="#b8c5d3" stroke-width="1"/>
    <line x1="50" y1="289" x2="430" y2="289" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3 1.5"/>
    <line x1="50" y1="293" x2="430" y2="293" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 1.5"/>

    <!-- Presilha Elástica de Segurança Interna (Esquerda) -->
    <rect x="48" y="184" width="34" height="112" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="65" y1="188" x2="65" y2="292" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="65" y="244" fill="#94a3b8" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">ARM</text>

    <!-- Aba de Fecho em Velcro com Costura Técnica em X (Direita) -->
    <rect x="396" y="184" width="36" height="112" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Textura do Velcro -->
    <rect x="398" y="186" width="32" height="108" fill="#e2e8f0" opacity="0.6"/>
    <line x1="400" y1="190" x2="428" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="428" y1="190" x2="400" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
    <rect x="400" y="188" width="28" height="104" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2"/>
  </g>
</svg>
