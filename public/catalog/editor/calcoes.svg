<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4f6fa"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Corpo principal dos calções (branco de estúdio) -->
    <path d="M 140 100 
             L 340 100 
             L 370 380 
             L 265 380 
             L 240 230 
             L 215 380 
             L 110 380 
             Z" 
          fill="url(#fabric)" 
          stroke="#cbd5e1" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Elástico do cós / Cintura -->
    <path d="M 140 100 L 340 100 L 336 142 L 144 142 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <line x1="142" y1="121" x2="338" y2="121" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Costuras internas e entrepernas -->
    <path d="M 240 142 L 240 230" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 110 380 L 215 380" stroke="#94a3b8" stroke-width="3"/>
    <path d="M 265 380 L 370 380" stroke="#94a3b8" stroke-width="3"/>

    <!-- Cordões da cintura -->
    <path d="M 232 135 C 230 160 228 175 224 190" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 248 135 C 250 160 252 175 256 190" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
