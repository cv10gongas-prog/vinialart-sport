<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#22262f"/>
      <stop offset="48%" stop-color="#111419"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="shortsShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f3f8"/>
      <stop offset="100%" stop-color="#d6dce7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Fundo estúdio neutro -->
  <rect width="480" height="480" fill="url(#bg)"/>
  <rect y="300" width="480" height="180" fill="url(#floor)"/>

  <!-- Sombra de contacto -->
  <ellipse cx="240" cy="425" rx="140" ry="18" fill="#000000" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Silhueta dos calções desportivos -->
    <path d="M 145 110 
             L 335 110 
             L 365 375 
             L 268 375 
             L 240 240 
             L 212 375 
             L 115 375 
             Z" 
          fill="url(#shortsShade)" 
          stroke="#b0bac9" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Cintura / Cós elástico -->
    <path d="M 145 110 L 335 110 L 332 145 L 148 145 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Costuras decorativas das pernas -->
    <path d="M 240 145 L 240 240" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 115 375 L 212 375" stroke="#94a3b8" stroke-width="3"/>
    <path d="M 268 375 L 365 375" stroke="#94a3b8" stroke-width="3"/>
    <!-- Cordão -->
    <path d="M 234 140 C 232 165 230 175 226 185" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 246 140 C 248 165 250 175 254 185" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
